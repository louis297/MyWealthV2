# MyWealth production compose project (docs/deployment.md §3–§8).
# Lives at /opt/mywealth on the VPS. The deploy job overwrites this file on every deploy:
# do not edit it on the VPS. Everything that differs per server comes from .env (see .env.example).
#
# Only `caddy` publishes ports on a public address; `aspire-dashboard` publishes its UI on 127.0.0.1 only
# (open it through an SSH tunnel, §5.1). Every .NET host listens on 8080 (traffic) and 8081 (health port,
# never forwarded by Caddy). The simulator also listens on 8082 (party port, internal network only, never
# forwarded by Caddy) and runs only with COMPOSE_PROFILES=simulator in .env (docs/deployment.md).
# Bind-mounted folders under certs/ and data/ must belong to UID 1654.

name: mywealth

x-dotnet-environment: &dotnet-environment
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_HTTP_PORTS: "8080;8081"
  # Traces, metrics and logs go to the telemetry dashboard (§5.1).
  OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889

x-dotnet-service: &dotnet-service
  restart: unless-stopped
  networks:
    - internal

x-healthcheck-timing: &healthcheck-timing
  interval: 15s
  timeout: 10s
  retries: 5
  start_period: 60s

x-connection-string: &connection-string >-
  Server=sql,1433;Database=MyWealthDbV2;User Id=sa;Password=${SQL_SA_PASSWORD:?};Encrypt=True;TrustServerCertificate=True

# The simulator's own database (docs/features/simulator.md R14). Only the simulator gets it.
x-simulator-connection-string: &simulator-connection-string >-
  Server=sql,1433;Database=MyWealthSimulatorDb;User Id=sa;Password=${SQL_SA_PASSWORD:?};Encrypt=True;TrustServerCertificate=True

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_MEMORY_LIMIT_MB: "2048"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?}
    volumes:
      - sql-data:/var/opt/mssql
    networks:
      - internal
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1" > /dev/null
      <<: *healthcheck-timing

  webapi:
    <<: *dotnet-service
    image: ghcr.io/${GHCR_OWNER:?}/mywealth-webapi:${IMAGE_TAG:?}
    environment:
      <<: *dotnet-environment
      OTEL_SERVICE_NAME: webapi
      ConnectionStrings__MyWealthDbV2: *connection-string
      Identity__Authority: https://id.${DOMAIN:?}
      Reports__StorageRoot: /reports
      # Bank connection `simulator` (docs/features/deposit-matching.md R1): webapi knows only its name and adapter.
      BankConnections__simulator__Adapter: Simulator
      # First start only; remove from .env after the first SystemAdmin sign-in (§12 step 11).
      Bootstrap__SystemAdmin__Email: ${BOOTSTRAP_SYSTEMADMIN_EMAIL:-}
      Bootstrap__SystemAdmin__Password: ${BOOTSTRAP_SYSTEMADMIN_PASSWORD:-}
      # First start of the simulator only; remove from .env after the first simulator sign-in.
      Bootstrap__SimulatorOperator__Email: ${BOOTSTRAP_SIMULATOROPERATOR_EMAIL:-}
      Bootstrap__SimulatorOperator__Password: ${BOOTSTRAP_SIMULATOROPERATOR_PASSWORD:-}
      # MediatR and AutoMapper read it from the environment. Without it they only log a license warning.
      LUCKYPENNY_LICENSE_KEY: ${LUCKYPENNY_LICENSE_KEY:-}
    volumes:
      - ./data/reports:/reports
    depends_on:
      sql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "/app/MyWealthV2.Web.dll", "--healthcheck"]
      <<: *healthcheck-timing

  identity:
    <<: *dotnet-service
    image: ghcr.io/${GHCR_OWNER:?}/mywealth-identity:${IMAGE_TAG:?}
    environment:
      <<: *dotnet-environment
      OTEL_SERVICE_NAME: identity
      ConnectionStrings__MyWealthDbV2: *connection-string
      Identity__AdviserPortalClientSecret: ${ADVISER_PORTAL_CLIENT_SECRET:?}
      Identity__CustomerPortalClientSecret: ${CUSTOMER_PORTAL_CLIENT_SECRET:?}
      Identity__BackOfficeClientSecret: ${BACK_OFFICE_CLIENT_SECRET:?}
      Identity__SimulatorClientSecret: ${SIMULATOR_CLIENT_SECRET:?}
      Identity__PortalOrigins__0: https://adviser.${DOMAIN:?}
      Identity__CustomerPortalOrigins__0: https://customer.${DOMAIN:?}
      Identity__BackOfficeOrigin: https://admin.${DOMAIN:?}
      Identity__SimulatorOrigin: https://sim.${DOMAIN:?}
      Identity__Issuer: https://id.${DOMAIN:?}/
      Identity__SigningCertificatePath: /certs/signing.pfx
      Identity__EncryptionCertificatePath: /certs/encryption.pfx
      Identity__CertificatePassword: ${IDENTITY_CERTIFICATE_PASSWORD:?}
      DataProtection__KeysPath: /keys
      ForwardedHeaders__KnownNetworks__0: 172.30.0.0/24
    volumes:
      - ./certs:/certs:ro
      - ./data/dataprotection/identity:/keys
    depends_on:
      webapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "/app/MyWealthV2.IdentityHost.dll", "--healthcheck"]
      <<: *healthcheck-timing

  worker:
    <<: *dotnet-service
    image: ghcr.io/${GHCR_OWNER:?}/mywealth-worker:${IMAGE_TAG:?}
    environment:
      <<: *dotnet-environment
      OTEL_SERVICE_NAME: worker
      ConnectionStrings__MyWealthDbV2: *connection-string
      Reports__StorageRoot: /reports
      Eodhd__ApiKey: ${EODHD_API_KEY:?}
      # Bank connection `simulator` (deposit-matching R1, R6). Worker does not depend on the simulator: with its
      # profile off, each run of the bank statement job fails with Unreachable and keeps its cursor.
      BankConnections__simulator__Adapter: Simulator
      BankConnections__simulator__BaseUrl: http://simulator:8082
      BankConnections__simulator__ApiKey: ${SIMULATOR_PARTY_API_KEY:?}
      BankConnections__simulator__PollMinutes: ${BANK_SIMULATOR_POLL_MINUTES:-1}
    volumes:
      - ./data/reports:/reports
    depends_on:
      webapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "/app/MyWealthV2.Worker.dll", "--healthcheck"]
      <<: *healthcheck-timing

  bff-adviser-portal:
    <<: *dotnet-service
    image: ghcr.io/${GHCR_OWNER:?}/mywealth-bff-adviser-portal:${IMAGE_TAG:?}
    environment:
      <<: *dotnet-environment
      OTEL_SERVICE_NAME: bff-adviser-portal
      Authentication__Authority: https://id.${DOMAIN:?}
      Authentication__ClientSecret: ${ADVISER_PORTAL_CLIENT_SECRET:?}
      Authentication__PublicOrigin: https://adviser.${DOMAIN:?}
      Api__BaseAddress: http://webapi:8080
      DataProtection__KeysPath: /keys
      ForwardedHeaders__KnownNetworks__0: 172.30.0.0/24
    volumes:
      - ./data/dataprotection/bff-adviser-portal:/keys
    depends_on:
      identity:
        condition: service_healthy
      webapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "/app/MyWealthV2.BffAdviserPortal.dll", "--healthcheck"]
      <<: *healthcheck-timing

  bff-customer-portal:
    <<: *dotnet-service
    image: ghcr.io/${GHCR_OWNER:?}/mywealth-bff-customer-portal:${IMAGE_TAG:?}
    environment:
      <<: *dotnet-environment
      OTEL_SERVICE_NAME: bff-customer-portal
      Authentication__Authority: https://id.${DOMAIN:?}
      Authentication__ClientSecret: ${CUSTOMER_PORTAL_CLIENT_SECRET:?}
      Authentication__PublicOrigin: https://customer.${DOMAIN:?}
      Api__BaseAddress: http://webapi:8080
      DataProtection__KeysPath: /keys
      ForwardedHeaders__KnownNetworks__0: 172.30.0.0/24
    volumes:
      - ./data/dataprotection/bff-customer-portal:/keys
    depends_on:
      identity:
        condition: service_healthy
      webapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "/app/MyWealthV2.BffCustomerPortal.dll", "--healthcheck"]
      <<: *healthcheck-timing

  back-office:
    <<: *dotnet-service
    image: ghcr.io/${GHCR_OWNER:?}/mywealth-back-office:${IMAGE_TAG:?}
    environment:
      <<: *dotnet-environment
      OTEL_SERVICE_NAME: back-office
      Authentication__Authority: https://id.${DOMAIN:?}
      Authentication__ClientSecret: ${BACK_OFFICE_CLIENT_SECRET:?}
      Authentication__PublicOrigin: https://admin.${DOMAIN:?}
      Api__BaseAddress: http://webapi:8080
      DataProtection__KeysPath: /keys
      ForwardedHeaders__KnownNetworks__0: 172.30.0.0/24
    volumes:
      - ./data/dataprotection/back-office:/keys
    depends_on:
      identity:
        condition: service_healthy
      webapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "/app/MyWealthV2.BackOffice.dll", "--healthcheck"]
      <<: *healthcheck-timing

  simulator:
    <<: *dotnet-service
    image: ghcr.io/${GHCR_OWNER:?}/mywealth-simulator:${IMAGE_TAG:?}
    # Off unless .env has COMPOSE_PROFILES=simulator. No other service depends on it, and every pull job
    # survives its absence (ADR 0021 rule 15).
    profiles: [simulator]
    environment:
      <<: *dotnet-environment
      ASPNETCORE_HTTP_PORTS: "8080;8081;8082"
      OTEL_SERVICE_NAME: simulator
      ConnectionStrings__MyWealthSimulatorDb: *simulator-connection-string
      Authentication__Authority: https://id.${DOMAIN:?}
      Authentication__ClientSecret: ${SIMULATOR_CLIENT_SECRET:?}
      Authentication__PublicOrigin: https://sim.${DOMAIN:?}
      # Not `:?`, so .env needs no key while the profile is off; the simulator itself refuses to start
      # without one of 32+ characters (docs/features/simulator.md R31).
      Simulator__PartyApiKey: ${SIMULATOR_PARTY_API_KEY:-}
      # Standing trust accounts (deposit-matching R39): the numbers of the demo tenant's client money accounts,
      # as the SystemAdmin adds them in the Back Office. Opened on first start and after every reset.
      Simulator__Bank__StandingAccounts__0__AccountNumber: ${SIM_BANK_USD_ACCOUNT_NUMBER:-SIM-DEMO-USD}
      Simulator__Bank__StandingAccounts__0__Currency: USD
      Simulator__Bank__StandingAccounts__0__Name: ${SIM_BANK_ACCOUNT_NAME:-Demo Advisory Client Funds Trust Account}
      Simulator__Bank__StandingAccounts__1__AccountNumber: ${SIM_BANK_NZD_ACCOUNT_NUMBER:-SIM-DEMO-NZD}
      Simulator__Bank__StandingAccounts__1__Currency: NZD
      Simulator__Bank__StandingAccounts__1__Name: ${SIM_BANK_ACCOUNT_NAME:-Demo Advisory Client Funds Trust Account}
      DataProtection__KeysPath: /keys
      ForwardedHeaders__KnownNetworks__0: 172.30.0.0/24
    volumes:
      - ./data/dataprotection/simulator:/keys
    depends_on:
      sql:
        condition: service_healthy
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "/app/MyWealthV2.Simulator.dll", "--healthcheck"]
      <<: *healthcheck-timing

  aspire-dashboard:
    # Same version as the Aspire packages in Directory.Packages.props. In memory only (§5.1).
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.5
    restart: unless-stopped
    mem_limit: 512m
    ports:
      # Loopback only: reach it with `ssh -N -L 18888:127.0.0.1:18888 <deploy-user>@<vps>`.
      - "127.0.0.1:18888:18888"
    networks:
      - internal

  caddy:
    build: ./caddy
    image: mywealth-caddy:local
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
      # Empty in .env means the production ACME issuer; set it to the Let's Encrypt staging
      # directory for a first start (§12).
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    volumes:
      # The folder, not the file: deploy.sh reloads Caddy after the deploy job replaces the Caddyfile.
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      internal:
        # Hosts inside the network reach the public issuer through Caddy, so the issuer always matches (§3).
        aliases:
          - id.${DOMAIN:?}
    depends_on:
      identity:
        condition: service_healthy
      bff-adviser-portal:
        condition: service_healthy
      bff-customer-portal:
        condition: service_healthy
      back-office:
        condition: service_healthy

networks:
  internal:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  sql-data:
  caddy-data:
  caddy-config:
