<h1>Session</h1>
<form (ngSubmit)="submit(accessField.value, refreshField.value)">
  <mat-form-field>
    <mat-label>Access token</mat-label>
    <textarea
      #accessField
      id="access-token"
      matInput
      name="accessToken"
      [ngModel]="accessToken"
      required
    ></textarea>
  </mat-form-field>
  <mat-form-field>
    <mat-label>Refresh token</mat-label>
    <textarea #refreshField id="refresh-token" matInput name="refreshToken" [ngModel]="refreshToken"></textarea>
  </mat-form-field>
  @if (error()) {
    <p role="alert">{{ error() }}</p>
  }
  <button matButton="filled" type="submit">Continue</button>
</form>
