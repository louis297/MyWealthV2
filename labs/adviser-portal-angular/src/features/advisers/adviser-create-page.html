<h1>New adviser</h1>
@if (error()) {
  <p>{{ error() }}</p>
}
<form (ngSubmit)="submit(nameField.value, emailField.value, passwordField.value, confirmField.value)">
  <mat-form-field>
    <mat-label>Name</mat-label>
    <input #nameField id="adviser-name" matInput name="name" required />
  </mat-form-field>
  <mat-form-field>
    <mat-label>Email</mat-label>
    <input #emailField id="adviser-email" matInput type="email" name="email" required />
  </mat-form-field>
  <mat-form-field>
    <mat-label>Password</mat-label>
    <input #passwordField id="adviser-password" matInput type="password" name="password" required />
  </mat-form-field>
  <mat-form-field>
    <mat-label>Confirm password</mat-label>
    <input #confirmField id="adviser-confirm" matInput type="password" name="confirm" required />
  </mat-form-field>
  <button matButton="filled" type="submit">Create</button>
</form>
