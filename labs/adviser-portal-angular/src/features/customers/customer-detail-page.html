@if (notFound()) {
  <p>Not found</p>
} @else if (customer(); as row) {
  <h1>{{ row.name }}</h1>
  @if (conflict()) {
    <p>This row changed. Reload and try again.</p>
  }
  <dl>
    <dt>Email</dt>
    <dd>{{ row.email }}</dd>
    <dt>Status</dt>
    <dd>{{ row.status }}</dd>
    <dt>Id</dt>
    <dd>{{ row.id }}</dd>
  </dl>
  <a [routerLink]="['/customers', row.id, 'edit']">Edit</a>
  <button type="button" (click)="changeStatus(row)">{{ row.status === 'disabled' ? 'Enable' : 'Disable' }}</button>
}
