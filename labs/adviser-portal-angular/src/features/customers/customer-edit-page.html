@if (notFound()) {
  <p>Not found</p>
} @else if (customer(); as row) {
  <h1>Edit customer</h1>
  <form (ngSubmit)="submit(row, nameField.value)">
    <mat-form-field>
      <mat-label>Name</mat-label>
      <input #nameField id="edit-customer-name" matInput name="name" [value]="row.name" required />
    </mat-form-field>
    @if (isTenantAdmin) {
      <label for="edit-customer-adviser">Adviser</label>
      <select id="edit-customer-adviser" name="adviserId" (change)="adviserId = selectValue($event)">
        @for (adviser of advisers(); track adviser.id) {
          <option [value]="adviser.id" [selected]="adviser.id === row.adviserId">{{ adviser.name }}</option>
        }
      </select>
    }
    <button matButton="filled" type="submit">Save</button>
  </form>
}
