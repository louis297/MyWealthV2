<h1>New customer</h1>
@if (error()) {
  <p>{{ error() }}</p>
}
<form (ngSubmit)="submit(nameField.value, emailField.value, passwordField.value, confirmField.value, '')">
  <mat-form-field>
    <mat-label>Name</mat-label>
    <input #nameField id="customer-name" matInput name="name" required />
  </mat-form-field>
  <mat-form-field>
    <mat-label>Email</mat-label>
    <input #emailField id="customer-email" matInput type="email" name="email" required />
  </mat-form-field>
  <mat-form-field>
    <mat-label>Password</mat-label>
    <input #passwordField id="customer-password" matInput type="password" name="password" required />
  </mat-form-field>
  <mat-form-field>
    <mat-label>Confirm password</mat-label>
    <input #confirmField id="customer-confirm" matInput type="password" name="confirm" required />
  </mat-form-field>
  @if (isTenantAdmin) {
    <label for="customer-adviser">Adviser</label>
    <select id="customer-adviser" name="adviserId" required (change)="adviserId = selectValue($event)">
      @for (adviser of advisers(); track adviser.id) {
        <option [value]="adviser.id">{{ adviser.name }}</option>
      }
    </select>
  }
  <button matButton="filled" type="submit">Create</button>
</form>
